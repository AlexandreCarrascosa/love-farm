name: Test and deploy Love Farm
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and animation geometry
        run: |
          node --check game.js
          node --check farm-core.js
          node --test tests/core.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir public
          cp index.html style.css farm-core.js game.js favicon.svg public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
